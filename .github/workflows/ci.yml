name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test suite
        run: python -m pytest tests/ -q

  acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: scan_bad fails the gate (high findings present)
        run: |
          set +e
          cursor-scan fixtures/scan_bad --no-save --format json > /tmp/scan_bad.json
          rc=$?
          set -e
          test $rc -eq 1 || { echo "expected exit 1, got $rc"; cat /tmp/scan_bad.json; exit 1; }
          python - <<'EOF'
          import json
          doc = json.load(open("/tmp/scan_bad.json"))
          assert doc["findings"], "expected findings in scan_bad"
          assert doc["score"] < 90, "scan_bad must score poorly"
          EOF
      - name: scan_good passes clean (zero findings)
        run: |
          set +e
          cursor-scan fixtures/scan_good --no-save --format json > /tmp/scan_good.json
          rc=$?
          set -e
          test $rc -eq 0 || { echo "expected exit 0, got $rc"; cat /tmp/scan_good.json; exit 1; }
          python - <<'EOF'
          import json
          doc = json.load(open("/tmp/scan_good.json"))
          assert not doc["findings"], "scan_good must be clean"
          assert doc["grade"] == "A"
          EOF
