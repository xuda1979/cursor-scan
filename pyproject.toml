[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-scan"
version = "1.0.0"
description = "Local security-debt scanner for vibe-coded projects: rule engine (weak crypto / secrets / deserialization / injection / permissions), scorecard, CLI gate and SARIF output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cursor-Scan" }]
keywords = ["security", "scanner", "static-analysis", "sarif", "audit"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "tree-sitter>=0.26",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cursor-scan = "cursorscan.cli:main"

[tool.setuptools.packages.find]
include = ["cursorscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
